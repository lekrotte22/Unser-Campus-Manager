<div class="panel-container">
  <div class="todo-card">
    <div class="title-wrapper">
      <h1 class="todo-title">Todos</h1>
    </div>

    <div class="input-container">
      <input
        type="text"
        [(ngModel)]="newTodoText"
        placeholder="Todo Hinzufügen"
        (keyup.enter)="addTodo()"
        class="todo-input"
      >
      <button (click)="addTodo()" class="add-button" aria-label="Todo hinzufügen">+</button>
    </div>

    <div class="todo-list">
      <div class="todo-state" *ngIf="isLoading">Laden…</div>

      <div class="todo-state todo-error" *ngIf="hasError && !isLoading">
        <span>Fehler beim Laden</span>
        <button class="retry-button" (click)="loadTodos()">Erneut versuchen</button>
      </div>

      <app-todo
        *ngFor="let todo of todos"
        [title]="todo.name"
        [completed]="todo.fertig"
        (toggled)="toggleTodo(todo, $event)"
        (removed)="removeTodo(todo)"
      ></app-todo>

      <div class="todo-empty" *ngIf="!isLoading && !hasError && todos.length === 0">
        Keine Todos vorhanden.
      </div>
    </div>
  </div>
</div>
